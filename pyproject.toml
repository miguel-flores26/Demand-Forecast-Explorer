[project]
name = "forecast-explorer"
version = "0.1.0"
description = "Interactive demand-forecasting app comparing simple and statistical models with honest backtests."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
